spring.application.name=ms-checkin
# El puerto de este microservicio (para que no choque con el 8081 de reservas)
server.port=8082

# Conexión a tu MySQL local
spring.datasource.url=jdbc:mysql://localhost:3306/db_checkin?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
